version: '3.8'

services:
  # Backend API
  backend:
    build: .
    container_name: raglaw-backend
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-http://host.docker.internal:8045}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-gemini-3-flash}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-hcmute_wseg}
      - USE_WORD_SEGMENT=${USE_WORD_SEGMENT:-true}
      - USE_RERANK=${USE_RERANK:-true}
      - DEVICE=${DEVICE:-cpu}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # Frontend (optional)
  frontend:
    build: ./frontend
    container_name: raglaw-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  # Redis cache (optional)
  redis:
    image: redis:7-alpine
    container_name: raglaw-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: raglaw-qdrant
    ports:
      - "${QDRANT_PORT:-6333}:6333"    # REST API
      - "${QDRANT_GRPC_PORT:-6334}:6334"  # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  redis_data:
  qdrant_data:


networks:
  default:
    name: raglaw-network
